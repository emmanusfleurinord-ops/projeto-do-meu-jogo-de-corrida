<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORRIDA F-E-K</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏃 CORRIDA F-E-K</h1>
        <div class="info">
            <span id="score">Pontos: 0</span>
            <span id="speed">Velocidade: 1</span>
        </div>
        
        <!-- Tamanho maior para ocupar mais a tela -->
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        
        <div id="message" class="message">
            Pressione <strong>ESPAÇO</strong> ou qualquer <strong>SETA</strong> para começar!<br>
            Ou clique na estrada.
        </div>
        <div class="controls">
            <p>⬆️ Frente &nbsp; ⬇️ Trás &nbsp; ⬅️ Esquerda &nbsp; ➡️ Direita</p>
            <p><strong>P</strong> ou <strong>ESC</strong> = Pausar &nbsp; | &nbsp; <strong>F</strong> = Tela Cheia</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
